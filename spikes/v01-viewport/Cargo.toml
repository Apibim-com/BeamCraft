[package]
name = "beamcraft-v01-viewport-spike"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
publish = false

[workspace]

# Pins follow docs/audits/ui-stack-audit-v0.1.md. default_fonts stays OFF (Ubuntu/Bitstream licences fail policy);
# the UI font is the admitted Inter (assets/fonts/inter). The PdfCraft vendor patches (winit, egui-wgpu,
# vello_common) are NOT applied in this spike; their use is a separate owner decision.
[dependencies]
egui = { version = "=0.36.2", default-features = false }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu_no_default_features", "accesskit", "links", "wayland", "x11"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal"] }
pollster = "1"
beamcraft-geom = { path = "../../crates/geom" }
beamcraft-kernel = { path = "../../crates/kernel" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "83bf4cb25c01ed46e7645c4172974239868aaf06" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "83bf4cb25c01ed46e7645c4172974239868aaf06" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"