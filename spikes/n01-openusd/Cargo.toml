[package]
name = "beamcraft-n01-openusd-spike"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
openusd = { version = "=0.8.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
