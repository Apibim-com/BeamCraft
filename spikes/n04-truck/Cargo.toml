[package]
name = "beamcraft-n04-truck-spike"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
truck-modeling = "=0.6.0"
truck-shapeops = "=0.4.0"
