version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    # egui and eframe move together with the patched eframe fork (issue #149, root Cargo.toml
    # [patch.crates-io]), and skrifa stays on the version epaint uses; a bump of one alone
    # cannot build, so these are updated by hand.
    ignore:
      - dependency-name: egui
      - dependency-name: eframe
      - dependency-name: skrifa
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
