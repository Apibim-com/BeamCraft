[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.96"
repository = "https://github.com/Apibim-com/BeamCraft"
authors = ["Apibim"]

[workspace.dependencies]
# internal
beamcraft-geom = { path = "crates/geom", version = "0.0.1" }
beamcraft-model = { path = "crates/model", version = "0.0.1" }
beamcraft-protocol = { path = "crates/protocol", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Every file, model and keystroke is untrusted input: no panics outside tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
indexing_slicing = "warn"

# Tests hash whole worker binaries (about 110 MB in a debug build) with the model's SHA-256
# before every spawn; unoptimized, that takes about 12 s each and parallel tests on a small CI
# runner exceed the 30 s worker deadline. Optimizing this one pure crate keeps debug assertions
# and overflow checks and makes the hash about 15 times faster.
[profile.dev.package.beamcraft-model]
opt-level = 3

# Release builds for development: 16 codegen units per crate and no LTO, not even within a
# crate, so a large crate is code-generated on several cores and no binary is optimized again as
# a whole when it is linked. With one codegen unit and ThinLTO across crates (the `dist` settings
# below), the largest dependency, `openusd`, is code-generated on a single core, and a cold build
# of both apps needs 25 to 30 percent more CPU time and ends with slow, mostly serial links.
[profile.release]
codegen-units = 16
lto = "off"
strip = "symbols"

# Dev-release: the USD reference stack (`openusd`, the largest dependency) stays unoptimized
# so a cold build of both apps fits the Apibim-com/BeamCraft#153 budget; workspace code keeps
# level 3. Performance measurements and packages use `dist`, which is unaffected by this.
[profile.release.package.openusd]
opt-level = 0

# Release packages (`.github/workflows/release.yml`, `packaging/package.sh`): ThinLTO across
# crates and one codegen unit per crate, for the smallest and fastest binaries.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
