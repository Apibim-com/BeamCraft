[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.95"
repository = "https://github.com/Apibim-com/BeamCraft"
authors = ["Apibim"]

[workspace.dependencies]
# internal
beamcraft-geom = { path = "crates/geom", version = "0.0.1" }
beamcraft-model = { path = "crates/model", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Every file, model and keystroke is untrusted input: no panics outside tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
