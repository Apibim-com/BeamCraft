# cargo-deny policy. Third-party dependencies use permissive licences only.
# MPL-2.0 is allowed only for the explicitly listed BeamCraft workspace packages.
# Third-party copyleft (GPL, AGPL, LGPL) is never linked.
# Copyleft tools may run only as external oracle processes. See AGENTS.md.
# Official OpenUSD TOST use has a scoped exception in AGENTS.md section 1.2.
# No OpenUSD package is in this Cargo graph. Do not allow TOST globally;
# add a verified package/version exception only if one enters the graph.
# The `openusd` crate 0.8.x declares MIT, but its file src/usd/core_schemas.rs is covered by
# TOST-1.0 (owner decision 2026-10-15, AGENTS.md section 1.2). cargo-deny reads only the manifest
# and cannot see that per-file licence. If the `openusd` package enters the Cargo graph of this
# workspace, a package/version exception and the TOST file-level notice review recorded in
# ATTRIBUTION.md are required first. The N01 spike is outside the workspace graph.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[[licenses.exceptions]]
name = "beamcraft-geom"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-kernel"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-model"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-protocol"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-host"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-cli"
version = "0.0.1"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# V01.0 (docs/audits/ui-stack-audit-v0.1.md): admit storytold/craft-libs only at
# rev 83bf4cb25c01ed46e7645c4172974239868aaf06, and only for craft-ui and craft-quit.
# cargo-deny 0.20.2 matches this URL, not the revision. required-git-spec forces a
# rev pin; it does not bind the URL to that commit. Do not depend on craft-print,
# craft-pdf, craft-cms, or this repo's vendored PDF trees under this entry.
allow-git = ["https://github.com/storytold/craft-libs"]
required-git-spec = "rev"

[advisories]
yanked = "warn"
