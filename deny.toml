# cargo-deny policy. Third-party dependencies use permissive licences only.
# MPL-2.0 is allowed only for the explicitly listed BeamCraft workspace packages.
# Third-party copyleft (GPL, AGPL, LGPL) is never linked.
# Copyleft tools may run only as external oracle processes. See AGENTS.md.
# Official OpenUSD TOST use has a scoped exception in AGENTS.md section 1.2.
# No OpenUSD package is in this Cargo graph. Do not allow TOST globally;
# add a verified package/version exception only if one enters the graph.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[[licenses.exceptions]]
name = "beamcraft-geom"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-model"
version = "0.0.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "beamcraft-cli"
version = "0.0.1"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[advisories]
yanked = "warn"
