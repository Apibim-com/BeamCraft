[package]
name = "beamcraft-cli"
description = "Command-line interface for BeamCraft."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "beamcraft"
path = "src/main.rs"

[[bin]]
name = "beamcraft-usd-worker"
path = "src/bin/beamcraft-usd-worker.rs"

[dependencies]
beamcraft-model.workspace = true
beamcraft-host = { path = "../../crates/host" }
beamcraft-protocol.workspace = true
beamcraft-layer-engine = { path = "../../crates/layer-engine" }

[lints]
workspace = true
